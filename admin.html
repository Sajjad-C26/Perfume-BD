<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PerfumeBD — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,560;1,9..144,500&family=EB+Garamond:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#15130f;--paper:#f6f3ec;--line:#d9d2c2;--bronze:#8c7745;--stone:#6b6558;--serif:'Fraunces',Georgia,serif;--body:'EB Garamond',Georgia,serif;--danger:#8a3324}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px}
.wrap{max-width:760px;margin:0 auto;padding:0 20px}
h1,h2{font-family:var(--serif);font-weight:560}
input,select{width:100%;border:1px solid var(--line);background:#fff;padding:10px 12px;font-family:var(--body);font-size:16px;color:var(--ink);margin-bottom:12px}
label{font-size:14px;color:var(--stone);display:block;margin-bottom:4px}
button{font-family:var(--body);font-size:15px;cursor:pointer;border:1px solid var(--ink);background:none;padding:10px 20px}
button:hover{background:var(--ink);color:var(--paper)}
button.primary{background:var(--ink);color:var(--paper)}
button.danger{border-color:var(--danger);color:var(--danger)}
button.danger:hover{background:var(--danger);color:#fff}

#login{max-width:340px;margin:80px auto;text-align:center}
#login h1{margin-bottom:20px;font-size:26px}
#login .msg{color:var(--danger);font-size:14px;min-height:18px;margin-top:6px}

#app{display:none}
header{border-bottom:1px solid var(--line);padding:20px 0;display:flex;justify-content:space-between;align-items:center}
header .mark{font-family:var(--serif);font-style:italic;font-size:22px}
section{padding:32px 0;border-bottom:1px solid var(--line)}
section h2{font-size:22px;margin-bottom:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.row>div{flex:1;min-width:140px}
.list{display:grid;gap:10px}
.item{border:1px solid var(--line);padding:12px;display:flex;gap:12px;align-items:center}
.item img{width:56px;height:56px;object-fit:cover;border:1px solid var(--line)}
.item .info{flex:1}
.item .info b{font-family:var(--serif);font-weight:500}
.item .info span{display:block;font-size:14px;color:var(--stone)}
.actions{display:flex;gap:8px}
.hint{font-size:13px;color:var(--stone);margin-top:-4px;margin-bottom:12px}
.progress{font-size:14px;color:var(--bronze)}
</style>
</head>
<body>

<div id="login">
  <h1>PerfumeBD Admin</h1>
  <input id="lEmail" type="email" placeholder="Email" autocomplete="username">
  <input id="lPass" type="password" placeholder="Password" autocomplete="current-password">
  <button class="primary" style="width:100%" id="lBtn">Log in</button>
  <p class="msg" id="lMsg"></p>
</div>

<div id="app">
  <div class="wrap">
    <header><span class="mark">PerfumeBD Admin</span><button id="logoutBtn">Log out</button></header>

    <section>
      <h2>Contact numbers</h2>
      <p class="hint">Used for the floating WhatsApp / Call buttons and order notifications. WhatsApp number in international format, no + or spaces (e.g. 8801XXXXXXXXX).</p>
      <div class="row">
        <div><label>WhatsApp number</label><input id="sWhats"></div>
        <div><label>Call number</label><input id="sPhone"></div>
      </div>
      <button id="saveSettings">Save numbers</button>
      <p class="hint" id="sMsg"></p>
    </section>

    <section>
      <h2>Add a product</h2>
      <div class="row">
        <div><label>Name</label><input id="pName"></div>
        <div><label>Price (৳)</label><input id="pPrice" type="number"></div>
      </div>
      <div class="row">
        <div><label>Old price (optional, for discount)</label><input id="pOld" type="number"></div>
        <div><label>Badge (optional)</label><select id="pBadge"><option value="">None</option><option>New</option><option>Limited</option></select></div>
      </div>
      <div class="row">
        <div><label>Category</label><select id="pCategory">
          <option value="men">Men's Luxury</option>
          <option value="women">Women's Ethereal</option>
          <option value="unisex">Unisex Signature</option>
          <option value="gift">Gift Sets</option>
        </select></div>
      </div>
      <label>Photo</label>
      <input id="pFile" type="file" accept="image/*">
      <p class="progress" id="pProgress"></p>
      <button class="primary" id="pSave">Add product</button>
      <p class="hint" id="pMsg"></p>
    </section>

    <section>
      <h2>Products</h2>
      <div class="list" id="pList"><p class="hint">Loading…</p></div>
    </section>

    <section style="border-bottom:none">
      <h2>Recent orders</h2>
      <div class="list" id="oList"><p class="hint">Loading…</p></div>
    </section>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/firebase@10.13.2/firebase-app-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.13.2/firebase-auth-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.13.2/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyByTWDqbcioz1CJGRZB38RN8ADXIjBH4iA",
  authDomain: "perfume-bd-e6935.firebaseapp.com",
  projectId: "perfume-bd-e6935",
  storageBucket: "perfume-bd-e6935.firebasestorage.app",
  messagingSenderId: "1007653869775",
  appId: "1:1007653869775:web:35e1e3197d71fb49f03fba"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
const CLOUD_NAME = "cgl2rdax";
const UPLOAD_PRESET = "perfumebd_products";

document.getElementById('lBtn').onclick = async ()=>{
  const email = document.getElementById('lEmail').value.trim();
  const pass = document.getElementById('lPass').value;
  const msg = document.getElementById('lMsg');
  try{
    await auth.signInWithEmailAndPassword(email, pass);
  }catch(err){
    msg.textContent = 'Login failed — check email and password.';
  }
};
document.getElementById('logoutBtn').onclick = ()=> auth.signOut();

auth.onAuthStateChanged(user=>{
  document.getElementById('login').style.display = user ? 'none' : 'block';
  document.getElementById('app').style.display = user ? 'block' : 'none';
  if(user){ loadSettings(); loadProducts(); loadOrders(); }
});

function loadSettings(){
  db.collection('settings').doc('general').get().then(doc=>{
    const s = doc.exists ? doc.data() : {};
    document.getElementById('sWhats').value = s.whatsapp || '';
    document.getElementById('sPhone').value = s.phone || '';
  });
}
document.getElementById('saveSettings').onclick = async ()=>{
  const whatsapp = document.getElementById('sWhats').value.trim();
  const phone = document.getElementById('sPhone').value.trim();
  await db.collection('settings').doc('general').set({whatsapp, phone}, {merge:true});
  document.getElementById('sMsg').textContent = 'Saved.';
  setTimeout(()=>document.getElementById('sMsg').textContent='', 2000);
};

async function uploadToCloudinary(file){
  const fd = new FormData();
  fd.append('file', file);
  fd.append('upload_preset', UPLOAD_PRESET);
  const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, {method:'POST', body: fd});
  const json = await res.json();
  if(!json.secure_url) throw new Error('Upload failed');
  return json.secure_url;
}

document.getElementById('pSave').onclick = async ()=>{
  const name = document.getElementById('pName').value.trim();
  const price = Number(document.getElementById('pPrice').value);
  const oldPrice = document.getElementById('pOld').value ? Number(document.getElementById('pOld').value) : null;
  const badge = document.getElementById('pBadge').value || null;
  const category = document.getElementById('pCategory').value;
  const file = document.getElementById('pFile').files[0];
  const msg = document.getElementById('pMsg');
  const prog = document.getElementById('pProgress');
  if(!name || !price){ msg.textContent = 'Name and price are required.'; return; }
  try{
    let imageUrl = '';
    if(file){ prog.textContent = 'Uploading photo…'; imageUrl = await uploadToCloudinary(file); prog.textContent = ''; }
    await db.collection('products').add({
      name, price, oldPrice, badge, category, imageUrl,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    msg.textContent = 'Product added.';
    document.getElementById('pName').value='';
    document.getElementById('pPrice').value='';
    document.getElementById('pOld').value='';
    document.getElementById('pBadge').value='';
    document.getElementById('pFile').value='';
    document.getElementById('pCategory').value='men';
    setTimeout(()=>msg.textContent='', 2000);
  }catch(err){
    msg.textContent = 'Something went wrong — try again.';
    console.error(err);
  }
};

function loadProducts(){
  db.collection('products').orderBy('createdAt','desc').onSnapshot(snap=>{
    const list = document.getElementById('pList');
    if(snap.empty){ list.innerHTML = '<p class="hint">No products yet.</p>'; return; }
    list.innerHTML = snap.docs.map(d=>{
      const p = d.data();
      return `<div class="item">
        <img src="${p.imageUrl||''}" alt="">
        <div class="info"><b>${p.name}</b><span>৳${Number(p.price).toLocaleString()}${p.oldPrice?(' (was ৳'+Number(p.oldPrice).toLocaleString()+')'):''}${p.badge?(' · '+p.badge):''}${p.category?(' · '+({men:"Men's Luxury",women:"Women's Ethereal",unisex:"Unisex Signature",gift:"Gift Sets"}[p.category]||p.category)):''}</span></div>
        <div class="actions"><button class="danger" data-del="${d.id}">Delete</button></div>
      </div>`;
    }).join('');
  });
}
document.getElementById('pList').addEventListener('click', e=>{
  const b = e.target.closest('[data-del]'); if(!b) return;
  if(confirm('Delete this product?')) db.collection('products').doc(b.dataset.del).delete();
});

function loadOrders(){
  db.collection('orders').orderBy('createdAt','desc').limit(50).onSnapshot(snap=>{
    const list = document.getElementById('oList');
    if(snap.empty){ list.innerHTML = '<p class="hint">No orders yet.</p>'; return; }
    list.innerHTML = snap.docs.map(d=>{
      const o = d.data();
      const t = o.createdAt ? o.createdAt.toDate().toLocaleString() : '';
      const itemsLine = o.items && o.items.length
        ? o.items.map(i=>`${i.name} (x${i.quantity})`).join(', ') + (o.total?` — ৳${Number(o.total).toLocaleString()}`:'')
        : (o.product || '');
      return `<div class="item">
        <div class="info"><b>${o.name}</b><span>${itemsLine}</span><span>${o.phone} · ${o.address}</span><span>${t}</span></div>
        <div class="actions"><button class="danger" data-delo="${d.id}">Delete</button></div>
      </div>`;
    }).join('');
  });
}
document.getElementById('oList').addEventListener('click', e=>{
  const b = e.target.closest('[data-delo]'); if(!b) return;
  if(confirm('Delete this order?')) db.collection('orders').doc(b.dataset.delo).delete();
});
</script>
</body>
</html>
